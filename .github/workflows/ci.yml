name: Validate OpenPrintText

on:
  push:
    branches: [main, "maintenance/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run SVG engine regression tests
        run: npm test
      - name: Check offline build
        run: python3 scripts/build-standalone.py
      - name: Verify offline bundle matches the current source
        run: python3 scripts/verify-standalone.py
      - name: Upload tested current offline bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: OpenPrintText-current-offline
          path: release/OpenPrintText-v0.1.0.html
          if-no-files-found: error
          retention-days: 30
