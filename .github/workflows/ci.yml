name: Validate OpenPrintText

on:
  push:
    branches: [main, "maintenance/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run SVG engine regression tests
        run: npm test
      - name: Check offline build
        run: python3 scripts/build-standalone.py
      - name: Confirm output is an HTML document
        run: test -s release/OpenPrintText-v0.1.0.html
